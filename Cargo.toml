[workspace]
resolver = "2"
members = ["crates/dock-core", "crates/dock-py"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
authors = ["The OpenDocking Project"]
repository = "https://github.com/GrassBlock-WE/opendocking"
homepage = "https://github.com/GrassBlock-WE/opendocking"
readme = "README.md"

[workspace.dependencies]
glam = "0.29"
rayon = "1.10"
thiserror = "2"

# Clippy runs with `-D warnings` in CI, so the findings that already exist are
# acknowledged here by name rather than hidden behind `continue-on-error` (see
# CONTRIBUTING.md).  Measured on rustc 1.98's clippy, `--all-targets`: 33
# findings, of which 15 are in the library itself.  Anything not on this list —
# including a new occurrence of a *different* lint — fails the build.
#
# Fixing them is deliberately not part of the 0.1.0 release: `needless_range_loop`
# (18) is the flat-buffer indexing the numeric kernels read best, and
# `neg_cmp_op_on_partial_ord` (4) marks comparisons whose NaN behaviour would
# have to be re-derived, term by term, to rewrite them safely.
[workspace.lints.clippy]
needless_range_loop = "allow"          # 18
too_many_arguments = "allow"           # 4  (constructors that mirror the Rust API)
neg_cmp_op_on_partial_ord = "allow"    # 4
needless_option_as_deref = "allow"     # 2
byte_char_slices = "allow"             # 2
manual_clamp = "allow"                 # 2
useless_vec = "allow"                  # 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

# Development builds carry no debug info: the kernel is numerically dense and
# the compiler's PDB write is a needless bottleneck on Windows. Panic messages
# still report file/line/column because that is compiled into the code.
[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

