[package]
name = "dock-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "PyO3 bindings for the OpenDocking kernel"

# The acknowledged clippy findings live in the workspace manifest, so the CI gate
# (`cargo clippy --workspace --all-targets -- -D warnings`) fails on anything new.
[lints]
workspace = true

[lib]
name = "_odock"
crate-type = ["cdylib", "rlib"]

[dependencies]
dock-core = { version = "0.1.0", path = "../dock-core" }
numpy = "0.27.1"
pyo3 = { version = "0.27.2", features = ["extension-module"] }
